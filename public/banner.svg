    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(72, 300)">
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-weight="900" font-size="118" letter-spacing="-5" fill="#fff">
      <tspan x="0" y="0">Score a</tspan>
      <tspan x="0" y="120" fill="url(#gradTagline)">250 or plus.</tspan>
    </text>
  </g>

  <!-- Subhead -->
  <text x="72" y="540" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="rgba(255,255,255,0.7)">
    Active-recall flashcards · case vignettes · high-yield notes
  </text>

  <!-- Stat chips bottom -->
  <g transform="translate(72, 568)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2" fill="rgba(255,255,255,0.55)">
    <g>
      <rect x="0" y="0" width="124" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#67e8f9"/>
      <text x="26" y="19">170+ NOTES</text>
    </g>
    <g transform="translate(136, 0)">
      <rect x="0" y="0" width="124" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#fbbf24"/>
      <text x="26" y="19">280+ CASES</text>
    </g>
    <g transform="translate(272, 0)">
      <rect x="0" y="0" width="156" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#c4b5fd"/>
      <text x="26" y="19">90+ ALGORITHMS</text>
    </g>
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="174" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#f0abfc"/>
      <text x="26" y="19">SPACED REPETITION</text>
    </g>
  </g>

  <!-- Domain bottom-right -->
  <text x="1128" y="586" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="end">
    250plus.org
  </text>
</svg>
