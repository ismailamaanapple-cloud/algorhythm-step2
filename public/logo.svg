<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14101f"/>
      <stop offset="100%" stop-color="#0a1a25"/>
    </linearGradient>
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textPlus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="textWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle interior glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Gradient ring border -->
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="url(#ringBg)" stroke-width="3" stroke-opacity="0.55"/>

  <!-- Wordmark: "250+" -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="220" letter-spacing="-12" text-anchor="middle">
    <text x="256" y="320" fill="url(#textWhite)" filter="url(#softGlow)">
      250<tspan fill="url(#textPlus)" dx="6">+</tspan>
    </text>
  </g>

  <!-- Tagline strip -->
  <text x="256" y="402" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" letter-spacing="6" font-weight="600" fill="rgba(255,255,255,0.55)" text-anchor="middle">
    STEP 2 CK · OMM
  </text>
</svg>
